[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "botbot"
version = "0.1.0"
description = "Multi-Agent Crypto Futures Trading Simulation with RL & Genetic Evolution"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}

dependencies = [
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "websockets>=12.0",
    "aiohttp>=3.9.0",
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
    "pydantic>=2.5.0",
    "ta>=0.11.0",
    "scikit-learn>=1.4.0",
]

[project.optional-dependencies]
rl = [
    "torch>=2.1.0",
    "gymnasium>=0.29.0",
    "stable-baselines3>=2.2.0",
]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.2.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
