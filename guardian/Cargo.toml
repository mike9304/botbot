[workspace]
resolver = "2"
members = [
    "guardian-common",
    "guardian-core",
    "guardian-android",
    "guardian-linux",
    "guardian-windows",
    "guardian-network",
    "guardian-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "MIT"
authors = ["JEONGMIN"]

[workspace.dependencies]
# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# Async runtime
tokio = { version = "1", features = ["full"] }

# Error handling
thiserror = "2"
anyhow = "1"

# Logging / tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Crypto
sha2 = "0.10"
hex = "0.4"

# Pattern matching
aho-corasick = "1"

# Database
rusqlite = { version = "0.32", features = ["bundled"] }

# File parsing
goblin = "0.9"
memmap2 = "0.9"

# ML inference
ort = { version = "2.0.0-rc.11", features = ["load-dynamic"] }
ndarray = "0.17"

# Bloom filter
bloomfilter = "1"

# Archive handling
zip = "2"
flate2 = "1"
tar = "0.4"

# CLI
clap = { version = "4", features = ["derive"] }

# Config
figment = { version = "0.10", features = ["toml", "env"] }

# Time
chrono = { version = "0.4", features = ["serde"] }

# UUID
uuid = { version = "1", features = ["v4", "serde"] }

[profile.release]
opt-level = 3
lto = "thin"
strip = true
